<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script>
        (
            function(){
                if (localStorage.getItem('theme') == 'Dark_Theme'){
                    document.documentElement.classList.add('preload-dark')
                }else if (localStorage.getItem('theme') == 'Zerodha_Theme'){
                    document.documentElement.classList.add('preload-zerodha')
                } else {
                    document.documentElement.classList = ""
                }
            }
        )();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
     <!-- Link to Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="navbar">
    <nav id="index-nav" class="top-nav">
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/simulate_returns">Simulate Returns</a>
        <a href="/process_price">Process Price</a>
        <a href="/metadata">Metadata Entry</a>
        <a href="/mf_txn">Mutual Funds Transactions</a>
        <a href="/stock_order_pdf">Stock Order PDF</a>
        <a href="/additional_links">Additional Links</a>
        <select id="change-theme">
            <option id ="light-theme-option">Light Theme</option>
            <option id ="dark-theme-option">Dark Theme</option>
            <option id ="zerodha-theme-option">Zerodha Theme</option>
        </select>
        <a href="/auth/logout">Logout</a>
    </nav>
</header>
<div class="wrapper">
    {% block content %}{% endblock %}
</div>
    <!-- Shared theme toggle script -->
    <script type="module" src="{{ url_for('static', filename='change_theme.js') }}" defer></script>

    <!-- Page-specific scripts -->
    {% block scripts %}{% endblock %}
<div id="notification-container" class="notification-container"></div>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; {{ current_year }} {{ app_name }}. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
